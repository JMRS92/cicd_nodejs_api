name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci
      # TODO: tres steps distintos: lint, format:check y test:unit

      - name: Comprobar linter
        run: npm run lint

      - name: Comprobar formato
        run: npm run format:check

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # TODO: ejecutar npm run coverage
      - run: npm run coverage
      # TODO: guardar coverage/ usando actions/upload-artifact
      # TODO: que el artefacto se guarde incluso si las pruebas fallan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
